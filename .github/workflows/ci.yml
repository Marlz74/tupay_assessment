name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Pint, PHPStan, Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tupay_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, redis, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          printf '\nDB_CONNECTION=pgsql\nDB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=tupay_testing\nDB_USERNAME=postgres\nDB_PASSWORD=postgres\nCACHE_STORE=redis\nREDIS_CLIENT=predis\nREDIS_HOST=127.0.0.1\nREDIS_PORT=6379\nQUEUE_CONNECTION=sync\nEAT_SECRET=testing-eat-secret\nWEBHOOK_SECRET=testing-webhook-secret\n' >> .env

      - name: Pint (style)
        run: vendor/bin/pint --test

      - name: PHPStan level 8
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Unit / feature tests
        run: php artisan test

      - name: Parallel concurrency race test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: tupay_testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CACHE_STORE: redis
          REDIS_CLIENT: predis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          EAT_SECRET: testing-eat-secret
        run: php artisan test -c phpunit.concurrency.xml
